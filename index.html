
<!DOCTYPE html>
<html>

<head>

<title>Personal AI Assistant</title>


<style>


body{

margin:0;
font-family:Arial;
background:#e8e8e8;

}


.dark{

background:#121212;

}



.container{

width:430px;
height:650px;
margin:20px auto;
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 0 15px gray;

}


.dark .container{

background:#1f1f1f;
color:white;

}



.header{

background:black;
color:white;
padding:15px;
text-align:center;
font-size:22px;

}



.buttons{

display:flex;
justify-content:space-around;
padding:10px;

}



button{

padding:10px;
border:none;
border-radius:20px;
cursor:pointer;

}



#chat{

height:470px;
padding:10px;
overflow:auto;

}



.user{

background:black;
color:white;
padding:10px;
margin:10px;
border-radius:15px;
text-align:right;

}



.bot{

background:#eeeeee;
padding:10px;
margin:10px;
border-radius:15px;

}



.dark .bot{

background:#333;
color:white;

}



.input{

display:flex;
padding:10px;

}



input{

flex:1;
padding:12px;
border-radius:20px;

}



.send{

background:black;
color:white;

}


.time{

font-size:10px;

}



</style>


</head>



<body>



<div class="container">


<div class="header">

🤖 Personal AI Assistant

</div>



<div class="buttons">

<button onclick="darkMode()">
🌙 Dark
</button>


<button onclick="clearChat()">
🗑 Clear
</button>


</div>



<div id="chat">


<div class="bot">

Namaste 😊 I am your AI Assistant

</div>


</div>



<div class="input">


<input id="msg"
placeholder="Ask anything..."
onkeypress="if(event.key==='Enter') send()">



<button class="send" onclick="send()">

Send

</button>


</div>


</div>





<script>



function time(){

return new Date().toLocaleTimeString();

}




function send(){


let message=document.getElementById("msg").value;


if(message=="")
return;



chat.innerHTML +=

"<div class='user'>"+
message+
"<div class='time'>"+
time()+
"</div></div>";



msg.value="";



fetch("/chat",{

method:"POST",

headers:{

"Content-Type":"application/x-www-form-urlencoded"

},

body:"message="+message


})


.then(res=>res.text())


.then(data=>{


chat.innerHTML +=

"<div class='bot'>"+
data+
"<div class='time'>"+
time()+
"</div></div>";



chat.scrollTop=chat.scrollHeight;


});


}




function darkMode(){

document.body.classList.toggle("dark");


}




function clearChat(){

document.getElementById("chat").innerHTML="";


}


</script>



</body>

</html>
